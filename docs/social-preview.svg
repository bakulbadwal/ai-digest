<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="AI Frontier Dispatch — a personalized AI and markets briefing you run yourself">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#faf9f5"/><stop offset="1" stop-color="#f1ebe0"/>
    </linearGradient>
    <radialGradient id="warmth" cx="0.16" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralBloom" cx="0.5" cy="0.88" r="0.6">
      <stop offset="0" stop-color="#cc785c" stop-opacity="0.12"/><stop offset="1" stop-color="#cc785c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#252320"/><stop offset="1" stop-color="#161513"/>
    </linearGradient>
    <linearGradient id="panelEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cc785c"/><stop offset="1" stop-color="#e8a55a"/>
    </linearGradient>
    <linearGradient id="barMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5db8a6"/><stop offset="1" stop-color="#5db8a6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="funnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cc785c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cc785c" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#cc785c" stop-opacity="0"/>
    </linearGradient>
    <filter id="panelShadow" x="-12%" y="-30%" width="128%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#4a3a2c" flood-opacity="0.20"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="panelClip"><rect x="200" y="404" width="880" height="170" rx="16"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#paper)"/>
  <rect width="1280" height="640" fill="url(#warmth)"/>
  <rect width="1280" height="640" fill="url(#coralBloom)"/>

  <text x="640" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" font-weight="500" letter-spacing="4" fill="#8e8b82">PERSONALIZED &#183; RUNS ON YOUR MACHINE</text>

  <text x="640" y="222" text-anchor="middle" font-family="Copernicus, 'Tiempos Headline', Georgia, 'Times New Roman', serif"
        font-size="86" font-weight="400" letter-spacing="-3" fill="#141413">AI Frontier</text>
  <text x="640" y="304" text-anchor="middle" font-family="Copernicus, 'Tiempos Headline', Georgia, 'Times New Roman', serif"
        font-size="86" font-weight="400" letter-spacing="-3" fill="#141413">Dispatch</text>

  <rect x="584" y="330" width="112" height="4" rx="2" fill="#cc785c"/>

  <text x="640" y="372" text-anchor="middle" font-family="StyreneB, Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="25" font-weight="400" fill="#3d3d3a">Frontier signal and market signal &#8212; one briefing, tuned to you.</text>

  <g filter="url(#panelShadow)">
    <rect x="200" y="404" width="880" height="170" rx="16" fill="url(#panel)"/>
  </g>
  <g clip-path="url(#panelClip)">
    <rect x="200" y="404" width="880" height="170" fill="url(#panelEdge)"/>
    <g fill="#6c6a64">
      <circle cx="242" cy="466" r="2.5" opacity="0.52"/><circle cx="270" cy="494" r="2.1" opacity="0.42"/>
      <circle cx="238" cy="528" r="2.8" opacity="0.48"/><circle cx="288" cy="460" r="2.2" opacity="0.38"/>
      <circle cx="260" cy="552" r="2.3" opacity="0.44"/><circle cx="302" cy="514" r="2.0" opacity="0.36"/>
      <circle cx="324" cy="474" r="2.4" opacity="0.44"/><circle cx="314" cy="548" r="2.1" opacity="0.34"/>
      <circle cx="348" cy="508" r="2.6" opacity="0.46"/><circle cx="360" cy="466" r="2.0" opacity="0.32"/>
      <circle cx="340" cy="554" r="2.2" opacity="0.36"/><circle cx="380" cy="532" r="2.1" opacity="0.34"/>
      <circle cx="388" cy="482" r="1.9" opacity="0.30"/><circle cx="280" cy="530" r="1.9" opacity="0.32"/>
      <circle cx="362" cy="526" r="1.8" opacity="0.28"/><circle cx="252" cy="504" r="2.0" opacity="0.34"/>
    </g>
    <circle cx="298" cy="488" r="2.8" fill="#cc785c" opacity="0.58"/>
    <circle cx="336" cy="540" r="2.4" fill="#e8a55a" opacity="0.48"/>
    <circle cx="254" cy="480" r="2.2" fill="#5db8a6" opacity="0.44"/>

    <rect x="418" y="418" width="1.5" height="142" fill="url(#funnel)"/>
    <g opacity="0.6" filter="url(#softGlow)">
      <rect x="416.5" y="448" width="4" height="86" fill="#cc785c" opacity="0.55"/>
    </g>
    <rect x="395" y="452" width="48" height="19" rx="9.5" fill="#cc785c" opacity="0.16"/>
    <rect x="395" y="452" width="48" height="19" rx="9.5" fill="none" stroke="#cc785c" stroke-opacity="0.45"/>
    <text x="419" y="465.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10.5" fill="#e8a55a" text-anchor="middle">&#8805;3/5</text>

    <g>
      <circle cx="452" cy="470" r="3.2" fill="#cc785c"/>
      <rect x="466" y="466.5" width="420" height="7" rx="3.5" fill="url(#barTop)"/>
      <circle cx="452" cy="502" r="2.9" fill="#e8a55a"/>
      <rect x="466" y="498.5" width="350" height="7" rx="3.5" fill="url(#barTop)" opacity="0.8"/>
      <circle cx="452" cy="534" r="2.7" fill="#5db8a6"/>
      <rect x="466" y="530.5" width="286" height="7" rx="3.5" fill="url(#barMid)"/>
      <circle cx="452" cy="562" r="2.3" fill="#8e8b82"/>
      <rect x="466" y="558.5" width="212" height="7" rx="3.5" fill="#faf9f5" opacity="0.16"/>
    </g>
    <text x="240" y="434" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="2.2" fill="#8e8b82">NOISE</text>
    <text x="1040" y="434" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" letter-spacing="2.2" fill="#cc785c">RANKED SIGNAL</text>
  </g>
  <rect x="200" y="404" width="880" height="170" rx="16" fill="none" stroke="#141413" stroke-opacity="0.16"/>

  <text x="640" y="614" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" letter-spacing="1.6" fill="#6c6a64">grok live&#8211;X &#183; hacker news &#183; github &#183; hugging face &#183; markets</text>
</svg>
